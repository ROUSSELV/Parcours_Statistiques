<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un travail dont tu es le héros – Statistiques 3ᵉ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Lexend:wght@400;600&display=swap">
<style>
:root{--ff:"Comic Sans MS","Comic Neue","Chalkboard SE",Arial,sans-serif;--fs:18px;--bg:#fff;--fg:#111;--pane:#eef5fb;--acc:#0070C0;--onacc:#fff;--acc2:#5B9BD5;--sal:#F7CAAC;--salt:#111;--line:#b9cfe6;--ok:#12663c;--ko:#a52714;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-bg]){--bg:#141a26;--fg:#f1f4fa;--pane:#1d2638;--acc:#7cc0ff;--onacc:#0b1220;--sal:#6b4331;--salt:#fff;--line:#34496a;--ok:#7be0a8;--ko:#ff9d8a}}
:root[data-bg="sombre"]{--bg:#141a26;--fg:#f1f4fa;--pane:#1d2638;--acc:#7cc0ff;--onacc:#0b1220;--sal:#6b4331;--salt:#fff;--line:#34496a;--ok:#7be0a8;--ko:#ff9d8a}
:root[data-bg="creme"]{--bg:#fbf4e2;--pane:#fffaf0}
:root[data-bg="jaune"]{--bg:#fffbd0;--pane:#fffde8}
:root[data-bg="bleu"]{--bg:#e5f1fb;--pane:#f7fbff}
:root[data-font="arial"]{--ff:Arial,Helvetica,sans-serif}
:root[data-font="lexend"]{--ff:Lexend,Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.6 var(--ff)}
:root[data-sp="1"] body{line-height:2.1;letter-spacing:.05em;word-spacing:.18em}
main{max-width:860px;margin:0 auto;padding:12px 16px 40px}
h1,h2,h3,h4{font-family:var(--ff);line-height:1.3}
h1{font-size:2.1em;color:var(--acc2);text-align:center;margin:.2em 0}
h2{font-size:1.3em;margin:.6em 0}h3{font-size:1.15em;margin:0}h4{font-size:1em;color:var(--acc);margin:.8em 0 .3em}
.kw{font-weight:400}:root[data-kw="1"] .kw{color:var(--acc);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 0}
.coins{display:flex;gap:6px}.coin{width:40px;height:40px;border-radius:50%;border:3px dashed var(--acc2);display:grid;place-items:center}
.coin.on{background:#FFC000;border:3px solid #FFC000;color:#222;font-weight:700}
button,input{font:inherit;color:inherit}
button{cursor:pointer;min-height:46px}
.btn{background:var(--acc);color:var(--onacc);border:2px solid var(--acc);border-radius:10px;padding:8px 18px;font-weight:700}
.btn.alt{background:transparent;color:var(--acc)}
:focus-visible{outline:4px solid #FFC000;outline-offset:2px}
.card{background:var(--pane);border:2px solid var(--acc2);border-radius:12px;padding:16px;margin:14px 0}
.sal{background:var(--sal);color:var(--salt);border-radius:10px;padding:10px 14px;margin:10px 0}
.sal ul{margin:.3em 0;padding-left:1.2em}
.inv{filter:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-bg]) .inv{filter:invert(1)}}
:root[data-bg="sombre"] .inv{filter:invert(1)}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero img{width:84px}.bulle{flex:1;min-width:220px}
.divider{width:100%;height:auto;display:block;margin:6px 0}
.doors{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.door{text-align:left;background:var(--pane);border:3px solid var(--acc2);border-radius:12px;padding:14px;min-height:130px}
.door.done{border-color:var(--ok)}.door b{color:var(--acc)}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:8px 0;flex-wrap:wrap}
.steps li{padding:4px 12px;border-radius:20px;border:2px solid var(--line)}
.steps .cur{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}.steps .done{border-color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.opt{background:var(--bg);border:3px solid var(--acc2);border-radius:10px;padding:8px 18px;min-width:90px}
.opt.ok{border-color:var(--ok);background:var(--ok);color:#fff}.opt.ko{border-color:var(--ko)}
.fb{font-weight:700}.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.exo{background:var(--pane);border:2px solid var(--acc2);border-radius:12px;padding:14px;margin:16px 0}
.exo header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.exo header h3{flex:1;color:var(--acc)}
.ico{width:56px;height:56px;object-fit:contain}
.snd{background:var(--bg);border:2px solid var(--acc);border-radius:10px;padding:6px 12px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;min-width:60%}th,td{border:2px solid var(--acc2);padding:8px 12px;text-align:center}
thead th{background:var(--acc2);color:#111}th[scope=row]{background:var(--pane);text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:10px 0}
.chips li{background:var(--bg);border:2px solid var(--acc2);border-radius:8px;padding:2px 10px}
.todo{list-style:none;padding:0;margin:0}.todo li{margin:8px 0}
.todo label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.todo input{width:28px;height:28px;flex:none;accent-color:var(--acc)}
.todo input:checked+span{opacity:.6}
details{border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;background:var(--bg)}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.term{background:none;border:0;border-bottom:3px dotted var(--acc);color:var(--acc);padding:0;min-height:0;font-weight:700}
input[type=text]{padding:8px 12px;width:150px;border:3px solid var(--acc2);border-radius:10px;background:var(--bg)}
.q{margin:14px 0;padding-bottom:10px;border-bottom:2px dashed var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.lv{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.lv button{text-align:left;background:var(--bg);border:3px solid var(--acc2);border-radius:12px;padding:12px}
.lv .rec{background:var(--sal);color:var(--salt);border-color:var(--sal)}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.65);display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:600px;max-height:88%;overflow:auto;margin:0;background:var(--bg)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.seg button{background:var(--bg);border:2px solid var(--acc2);border-radius:10px;padding:6px 14px}
.seg [aria-pressed=true]{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
.tip{font-size:.85em;opacity:.8}

.sc{display:flex;gap:12px;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}.sc .em{font-size:2.4em;line-height:1}.sc p{margin:0}
.emo{font-size:1.8em;letter-spacing:.1em;margin:6px 0}
.ill{max-width:270px;width:100%;height:auto;display:block;margin:8px auto;color:var(--fg)}.ill .b{fill:var(--acc2)}.ill line{stroke:currentColor}.ill text{fill:currentColor;font-family:var(--ff)}
.rb{border:2px solid var(--acc2);border-radius:12px;padding:12px;margin:12px 0;background:var(--pane)}.rb h3{color:var(--acc)}.rb .ex{background:var(--bg);border:2px dashed var(--acc2);border-radius:10px;padding:10px;margin:8px 0}
.big{font-size:1.4em;font-weight:700;color:var(--acc);text-align:center}
.flow{display:flex;gap:10px;justify-content:center;align-items:center;font-size:1.4em;font-weight:700;flex-wrap:wrap}
.grid20{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:300px;margin:8px auto}.grid20 i{aspect-ratio:1;border:2px solid var(--acc2);border-radius:4px}.grid20 i.f{background:var(--acc2)}
.chips .hl{background:var(--sal);color:var(--salt);font-weight:700}
.opt[aria-pressed=true]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.tag{background:var(--acc2);color:#111;border-radius:8px;padding:1px 8px;font-size:.75em;font-weight:700}
.quote{border-left:6px solid var(--sal);padding:4px 12px;margin:8px 0;font-style:italic}
.fig{margin:8px 0;text-align:center}.fig figcaption{font-weight:700;color:var(--acc)}.leg{display:flex;flex-wrap:wrap;gap:6px 16px;list-style:none;padding:0;justify-content:center;margin:4px 0}.leg li{display:flex;align-items:center;gap:6px}.leg i{width:18px;height:18px;border:2px solid #111;border-radius:3px;display:inline-block}.som{background:#cfe5f7;color:#0b3a66;border-bottom:3px solid #0070C0;padding:0 5px;border-radius:4px;font-weight:700}.nb{background:#F7CAAC;color:#111;border-bottom:3px dashed #c55a11;padding:0 5px;border-radius:4px;font-weight:700}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .2em;line-height:1.25}.fr>span{padding:0 .3em}.fr>span:first-child{border-bottom:2px solid currentColor}.fr .som,.fr .nb{border-bottom:0}.calc{font-size:1.3em;text-align:center;font-weight:700;margin:10px 0}.lg2{text-align:center;font-size:.95em}.rem{display:block;margin-top:.5em;font-style:italic}
.med{display:flex;justify-content:center;align-items:flex-start;gap:8px;flex-wrap:wrap;margin:12px 0}.med .g,.med .c{text-align:center}.med .lab{font-weight:700;font-size:.9em}.med .br{border:3px solid var(--acc);border-bottom:0;border-radius:8px 8px 0 0;height:12px;margin:2px 0}.med .chips{margin:0;justify-content:center}.med .ar{font-size:1.5em;line-height:1;color:var(--acc)}.med .c .lab{color:var(--acc)}
.df{margin:.8em 0}.rem ul{margin:.3em 0;padding-left:1.3em}.rem li{margin:.2em 0}.ill .gr{stroke-opacity:.2}.ill{max-width:330px}.calc.sm{font-size:.92em;white-space:nowrap;overflow-x:auto}.lg2{font-size:.78em;white-space:nowrap;overflow-x:auto;text-align:center}
.rb h3 small{font-size:.65em;font-style:italic;font-weight:400}.sq{display:inline-block;width:14px;height:14px;border:2px solid #111;border-radius:3px;margin-right:5px;vertical-align:middle}
.cal{font-size:1.5em}.expl{margin:4px 0 8px}.bar{height:14px;border:2px solid var(--acc);border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.nt{border:3px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}.nt.ok{border-color:var(--ok)}.nt.wa{border-color:#d9a400}.nt.ko{border-color:var(--ko)}
.who{background:var(--pane);border:2px solid var(--acc2);border-radius:10px;padding:4px 12px;margin:4px 0}
.names{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.names fieldset{border:2px solid var(--acc2);border-radius:10px;padding:8px 12px}.names legend{font-weight:700;color:var(--acc)}.names label{display:block;margin:6px 0}
input[type=password]{padding:8px 12px;width:120px;border:3px solid var(--acc2);border-radius:10px;background:var(--bg)}
.calsvg{width:30px;height:38px}.lock{width:34px;height:40px;vertical-align:middle;margin-right:8px}.hlc{background:var(--sal);color:var(--salt);font-weight:700}
.sc{flex-wrap:wrap}.sc .sct{flex:1;min-width:200px}.sc .sct .emo{margin:6px 0}.sc .sct .tip{margin:2px 0}.sc .emr{margin-left:auto;text-align:right}.sc .emr .emo{margin:0;white-space:nowrap}.sc .sct>p{margin:4px 0}.sc .sct>.tw,.sc .sct>.chips,.sc .sct>svg,.sc .sct>figure{margin:8px 0}.sc .sctr{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.sc .sctr .emr{margin-left:auto}.sc .sct h4{margin:10px 0 4px}.sey{max-width:100%;height:auto}</style>
</head>

const b=v.map((x,i)=>{const xx=X0+12+i*44;return `<rect class="b" x="${xx}" y="${y(x)}" width="30" height="${x/top*95}"/><text x="${xx+15}" y="${y(x)-5}" text-anchor="middle" font-size="12">${x}</text><text x="${xx+15}" y="136" text-anchor="middle" font-size="11">${l[i]}</text>`}).join("");
const ln=o.line!==undefined?`<line x1="${X0}" x2="${W-14}" y1="${y(o.line)}" y2="${y(o.line)}" stroke-dasharray="5 4" stroke-width="2" style="stroke:#d9480f"/><text x="${W-14}" y="${y(o.line)-4}" text-anchor="end" font-size="11" style="fill:#d9480f">moyenne ${o.line}</text>`:"";
const svg=`<svg class="ill" viewBox="0 -16 ${W+pad} 172" role="img" aria-label="${o.alt||"Diagramme en bâtons"}">${tk}${b}<line x1="${X0}" x2="${X0}" y1="14" y2="120" stroke-width="2"/><polygon points="${X0},6 ${X0-5},16 ${X0+5},16" style="fill:currentColor"/><line x1="${X0}" x2="${W-12}" y1="120" y2="120" stroke-width="2"/><polygon points="${W-4},120 ${W-14},115 ${W-14},125" style="fill:currentColor"/><text x="${X0}" y="-4" text-anchor="middle" font-size="11" font-weight="700">${o.y||""}</text><text x="${W+2}" y="124" font-size="11" font-weight="700">${o.x||""}</text>${ln}</svg>`;

const NL=(a,b,u,res)=>`<svg class="ill" viewBox="0 0 260 98" role="img" aria-label="Droite graduée de ${a} ${u} à ${b} ${u}"><line x1="20" x2="240" y1="46" y2="46" stroke-width="3"/><circle cx="20" cy="46" r="6" style="fill:#0070C0"/><circle cx="240" cy="46" r="6" style="fill:#d9480f"/><text x="20" y="28" font-size="10">plus petite valeur</text><text x="240" y="28" text-anchor="end" font-size="10">plus grande valeur</text><text x="20" y="68" text-anchor="middle" font-size="13" font-weight="700">${a} ${u}</text><text x="240" y="68" text-anchor="middle" font-size="13" font-weight="700">${b} ${u}</text>${res?`<text x="130" y="92" text-anchor="middle" font-size="12" font-weight="700">étendue = ${b-a} ${u}</text>`:""}</svg>`;
const MOY=(v,u="",f=vir,dec=2)=>{const n=v.length,s=+v.reduce((x,y)=>x+y,0).toFixed(6),r=s/n,ex=Math.abs(+r.toFixed(dec)*n-s)<1e-6,sm=n>8?f(s):v.map(f).join(" + "),lh=n>8?`<span class="som">${f(s)}</span>`:`(<span class="som">${sm}</span>)`;return `<p class="calc">m = ${lh} ÷ <span class="nb">${n}</span> ${ex?"=":"≈"} ${f(+r.toFixed(dec))}${u?" "+u:""}</p><p class="lg2"><span class="som">${sm}</span> : somme des valeurs&emsp;<span class="nb">${n}</span> : nombre de valeurs</p>`};
const MEDC=(s,f=vir,u="")=>{const n=s.length,uu=u?" "+u:"";if(n%2)return `<p class="calc">Me = ${f(s[(n-1)/2])}${uu}</p>`;const a=s[n/2-1],b=s[n/2];return `<p class="calc">Me = (${f(a)} + ${f(b)}) ÷ 2 = ${f(+((a+b)/2).toFixed(4))}${uu}</p>`};
const PT=(lab,eff,tot,ang,atot)=>`<div class="tw"><table><thead><tr><th scope="col"></th>${lab.map((x,i)=>`<th scope="col"><i class="sq" style="background:${PAL[i%5]}"></i>${x}</th>`).join("")}<th scope="col">Total</th></tr></thead><tbody><tr><th scope="row">Effectif</th>${eff.map(x=>`<td>${x}</td>`).join("")}<td>${tot}</td></tr><tr><th scope="row">Angle (°)</th>${ang.map((x,i)=>`<td style="background:${PAL[i%5]};color:${i?"#111":"#fff"};font-weight:700">${vir(x)}</td>`).join("")}<td>${atot}</td></tr></tbody></table></div><p class="lg2">Coefficient de proportionnalité : ${FR(atot,tot)} = ${vir(atot/tot)}&emsp;(effectif × ${vir(atot/tot)} = angle)</p>`;

const ANG=(e,t,A,r)=>`<div class="tw"><table><thead><tr><th scope="col"></th><th scope="col">Secteur</th><th scope="col">Total</th></tr></thead><tbody><tr><th scope="row">Effectif</th><td>${e}</td><td>${t}</td></tr><tr><th scope="row">Angle (°)</th><td class="hlc">${vir(r)}</td><td>${A}</td></tr></tbody></table></div><p class="calc sm">angle = ${FR(`${e} × ${A}`,t)} = ${vir(r)}°</p>`;

function MEDTXT(n){const k=n%2?`à la ${(n+1)/2}ᵉ valeur.`:`entre la ${n/2}ᵉ et la ${n/2+1}ᵉ valeur : c’est la moyenne de ces deux valeurs.`;return `Il y a ${n} valeurs.<br>La médiane se situe ${k}`}
function MED(s,f=x=>x){const n=s.length,odd=n%2===1,h=odd?(n-1)/2:n/2-1,mid=odd?[s[h]]:[s[h],s[h+1]],L=s.slice(0,h),R=s.slice(h+mid.length),g=a=>`<div class="g"><div class="lab">${a.length} valeur${a.length>1?"s":""}</div><div class="br"></div>${n<=9?`<ul class="chips">${a.map(v=>`<li>${f(v)}</li>`).join("")}</ul>`:`<ul class="chips"><li>…</li></ul>`}</div>`;

EX.d2b={t:"Défi · La note qui manque",ic:"",calc:1,q:"Quelle note doit obtenir Maël au 4ᵉ contrôle pour avoir une moyenne de **12** ?",d:`<p>Maël a obtenu ces notes à ses 3 premiers contrôles :</p>`+CH([11,14,9]),k:["Calcule la **somme** des 3 notes.","Calcule la **somme totale** nécessaire pour avoir 12 de moyenne sur 4 contrôles.","Déduis-en la note du **4ᵉ contrôle**."],a:[],c:`<p class="calc">4 × 12 = 48</p><p class="calc">11 + 14 + 9 = 34</p><p class="calc">48 − 34 = 14</p><p>Maël doit obtenir <b>14</b> au 4ᵉ contrôle.</p><p>Vérification :</p>`+MOY([11,14,9,14])};
EX.d2c={t:"Défi · Moyenne avec coefficients",ic:"",calc:1,q:"Calcule la moyenne de Chloé.",d:`<p>Voici les notes de Chloé au brevet blanc :</p>`+T(["Matière","Maths","Français","Histoire-géo","Anglais"],[["Note",14,11,8,17],["Coefficient",4,3,2,1]]),k:["Multiplie chaque **note** par son **coefficient**.","Additionne les résultats.","Divise par la **somme des coefficients**."],a:[],c:`<p class="calc sm">m = (14×4 + 11×3 + 8×2 + 17×1) ÷ (4 + 3 + 2 + 1)</p><p class="calc">m = 122 ÷ 10 = 12,2</p><p class="lg2"><span class="som">somme des notes × coefficients</span>&emsp;÷&emsp;<span class="nb">somme des coefficients</span></p>`};

rb:[
{t:"L’effectif et l’effectif total",def:"L’**effectif** d’une valeur est le nombre de fois où elle apparaît. L’**effectif total** est le nombre de réponses : on additionne tous les effectifs.",ex:SC("📚","Sondage du CDI :<br>« Quel est ton type de lecture préféré ? » auprès d’élèves.")+T(["Lecture","📖 Manga","🦸 BD","📕 Roman","📰 Magazine","Total"],[["Effectif",8,6,4,2,20]])+`<p>L’effectif de « manga » est <b>8</b>.<br>L’effectif total est 8 + 6 + 4 + 2 = <b>20</b>.</p>`,tip:"L’effectif total n’est pas le plus grand effectif : c’est la somme de tous."},
{t:"La fréquence",def:"La **fréquence** d’une valeur est sa part dans l’ensemble : **fréquence = <span class=fr><span>effectif</span><span>effectif total</span></span>**.",ex:SC("📖","Pour « manga » :<br>effectif 8, effectif total 20.")+BAR2(8,12,"manga","autre lecture","📖")+`<p class="calc sm"><span class=fr><span><span class='som'>8</span></span><span><span class='nb'>20</span></span></span> = 0,4 soit 40 % des élèves préfèrent les mangas.</p>`,tip:"On divise par l’effectif total, jamais par un autre effectif."},
{t:"Écrire une fréquence de trois façons",def:"Une fréquence s’écrit en **fraction**, en **nombre décimal** ou en **pourcentage**. La somme de toutes les fréquences vaut 1, soit 100 %.",ex:`<div class="flow"><span>8/20</span><span>→</span><span>0,4</span><span>→</span><span>40 %</span></div><p>Du décimal au pourcentage :<br>on multiplie par 100 (0,4 × 100 = 40).</p><p>Contrôle :<br>manga 40 % + BD 30 % + roman 20 % + magazine 10 % = <b>100 %</b>.</p>`,tip:"0,4 n’est pas 4 % : 0,4 = 40 %."}],

rb:[
{t:"La moyenne",def:"La **moyenne** est la valeur qu’auraient toutes les données si elles étaient les mêmes.<div class=\"calc sm\">m = <span class=\"som\">somme des valeurs</span> ÷ <span class=\"nb\">nombre de valeurs</span></div>",ex:SC("📝","Lina a obtenu ces notes à 4 contrôles :<br>12 ; 15 ; 9 ; 16.")+`<p class="calc">m = (<span class="som">12 + 15 + 9 + 16</span>) ÷ <span class="nb">4</span> = 13</p><p class="lg2"><span class="som">12 + 15 + 9 + 16</span> : somme des valeurs&emsp;<span class="nb">4</span> : nombre de valeurs</p><p><b>Conclusion :</b><br>la moyenne des notes de Lina est <b>13</b>.</p>`+BARS([12,15,9,16],["C1","C2","C3","C4"],{line:13,x:"Contrôle",y:"Note",title:"Les notes de Lina et leur moyenne",alt:"Diagramme en bâtons des notes 12, 15, 9 et 16 avec la moyenne 13"})+`<p><b>Interprétation :</b><br>si Lina avait obtenu les mêmes notes aux 4 contrôles, elle aurait eu la note de <b>13</b>.</p>`,tip:"On divise par le nombre de valeurs, pas par la somme."},
{t:"L’étendue",def:"**Étendue = plus grande valeur − plus petite valeur**. Elle mesure l’écart entre les extrêmes.",ex:SC("🏃","Temps au 100 m :<br>le plus rapide 12 s, le plus lent 19 s.")+NL(12,19,"s",true)+`<p class="calc">e = 19 − 12 = 7 s</p>`,tip:"On soustrait toujours la plus petite valeur à la plus grande."},
{t:"La médiane",def:"La **médiane** partage la série **rangée** en deux groupes de même effectif.<div class=\"rem\"><b>Remarque :</b><ul><li>Si le nombre de valeurs est <b>impair</b>, c’est la valeur du milieu.</li><li>Si le nombre de valeurs est <b>pair</b>, la médiane est la moyenne des deux valeurs du milieu.</li></ul></div>",ex:SC("⚽","Buts marqués en 7 matchs :<br>0 ; 3 ; 1 ; 2 ; 5 ; 1 ; 2.<br>On range la série dans l’ordre croissant.")+MED([0,1,1,2,2,3,5])+`<p>${MEDTXT(7)}</p><p class="calc">Me = 2</p><p>La médiane est <b>2</b>.</p>`+SC("🎲","Avec 6 valeurs déjà rangées :<br>2 ; 4 ; 5 ; 8 ; 9 ; 12.")+MED([2,4,5,8,9,12])+`<p>${MEDTXT(6)}</p><p class="calc">Me = (5 + 8) ÷ 2 = 6,5</p><p>La médiane est <b>6,5</b>.</p>`,tip:"On range toujours la série avant de chercher la médiane."}],

a.innerHTML=`<div class="row">${img("compass","ico")}<h2>Carte des missions</h2></div>${img("divider","divider")}<div class="card"><b>Taux de réussite de ${who()} : ${g===null?"–":g+" %"}</b>${bar(g||0)}</div><div class="doors">${M.map((x,i)=>`<div><button class="door ${S.pieces[i]?"done":""}" data-act="door" data-i="${i}"><b>Mission ${i+1}${S.pieces[i]?" · réussie ★":""}</b><br>${x.n}${rF(i)!==null?`<br>Défi flash : ${rF(i)} %`:""}${S.pieces[i]?`<br>Réussite : ${rT(i)} %`:""}</button>${S.pieces[i]?`<button class="btn alt" data-act="bilan" data-i="${i}">📊 Mon bilan</button>`:""}</div>`).join("")}</div><div class="card"><h3>Le coffre</h3>${dn?`<p><b>Code complet !</b> Les trois pièces s’assemblent.</p><div class="sal">Message du mystérieux professeur : « Les statistiques racontent ce que les nombres cachent. Bravo, statisticiens ! »</div><p><button class="btn" data-act="exit">Ticket de sortie</button></p>`:`<p>Il manque ${3-S.pieces.filter(Boolean).length} pièce(s). Réussis l’épreuve de synthèse de chaque mission.</p>`}</div><div class="card"><h3>${LOCK(unl)}⭐ Module défi</h3>${unl?`<p>Le module est déverrouillé. Trois exercices de difficulté croissante t’attendent.</p><button class="btn" data-act="mod">Accéder au module défi</button>`:`<p>Ce module est <b>verrouillé</b>. Il se débloque à partir de <b>75 % de réussite</b> sur les 3 missions${dn?` (taux actuel : ${g} %)`:""}, ou avec le code de l’enseignant.</p><details${S.codeErr?" open":""}><summary>🔑 Code de l’enseignant</summary><div class="row"><label>Code <input type="password" id="code" inputmode="numeric" autocomplete="off"></label><button class="btn alt" data-act="unlock">Déverrouiller</button></div>${S.codeErr?`<p class="fb ko">Code incorrect.</p>`:""}</details>`}</div>`}
else if(S.scr==="mod"){const n=MOD.s.length,ok=S.mod.fb.length===n&&S.mod.fb.every(Boolean);let i0=0;a.innerHTML=`<button class="btn alt" data-act="map">← Carte des missions</button><h2>⭐ Module défi</h2><p>3 exercices de difficulté croissante : liste, tableau, diagramme en bâtons. Calculatrice autorisée ${CALC}</p>${MOD.ex.map((x,gi)=>`<div class="card"><h3>${x.t}</h3><div id="mx${gi}">${BOXIT(x.d)}</div><button class="snd" data-act="say" data-id="mx${gi}">🔊 Écouter</button>${x.qs.map(q=>qItem(q,i0++,S.mod,"m")).join("")}</div>`).join("")}<div class="row"><button class="btn" data-act="chkm">Vérifier mes réponses</button></div>${ok?`<div class="sal"><b>Défi relevé !</b> ${who()} : réussites du premier coup ${S.mod.ft.filter(Boolean).length} sur ${n}.<br>Montre cet écran à ton professeur.</div>`:""}`}
else if(S.scr==="bilan"){const i=S.bm,R=S.res[i],f=rF(i),s=rS(i),p=s-f,tr=R.tries;a.innerHTML=`<button class="btn alt" data-act="map">← Carte des missions</button><h2>Bilan · Mission ${i+1}</h2><p>${M[i].t}</p><div class="card"><h3>Taux de réussite de ${who()} : ${rT(i)} %</h3>${bar(rT(i))}<div class="tw"><table><thead><tr><th scope="col">Étape</th><th scope="col">Résultat</th></tr></thead><tbody>${tr.map((T,j)=>`<tr><th scope="row">Défi flash · ${ess(j+1)}</th><td>${pc(fst(i,T.fl,T.s).ok,10)} %</td></tr>`).join("")}<tr><th scope="row">Épreuve de synthèse 1 (du premier coup)</th><td>${pc(R.ft.filter(Boolean).length,R.ft.length)} %</td></tr>${R.ft2?`<tr><th scope="row">Épreuve de synthèse 2 (du premier coup)</th><td>${pc(R.ft2.filter(Boolean).length,R.ft2.length)} %</td></tr>`:""}<tr><th scope="row">Mon parcours (auto-évaluation)</th><td>${ST().map(x=>`${x.n} : ${R.ae&&R.ae[x.k]!=null?AEC[R.ae[x.k]]:"–"}`).join("<br>")}</td></tr></tbody></table></div><p>${p>0?`📈 Progression : +${p} points entre le défi flash et l’épreuve de synthèse.`:p<0?`📉 ${Math.abs(p)} points de moins entre le défi flash et l’épreuve de synthèse : relisez les rappels.`:"➡️ Résultat stable entre le défi flash et l’épreuve de synthèse."}</p></div>${frag(i)?`<div class="card sal"><h3>Vos réponses sont encore fragiles</h3><p>Un 2ᵉ exercice de synthèse, avec d’autres valeurs, vous permet de consolider les notions à travailler.</p><button class="btn" data-act="syn2">Faire le 2ᵉ exercice de synthèse</button></div>`:""}<div class="card"><h3>Mes notions (bilan actualisé)</h3>${nlist(M[i],nst(i),true)}</div><button class="btn" data-act="map">Retour à la carte</button>`}
else if(S.scr==="exit"){a.innerHTML=`<div class="card"><h2>Ticket de sortie</h2><p><b>${who()}</b></p><h4>Je retiens</h4><div class="sal">Fréquence = <span class=fr><span>effectif</span><span>effectif total</span></span>.</div><div class="sal">Moyenne, étendue, médiane : on range avant de chercher la médiane.</div><div class="sal">Angle = <span class=fr><span>effectif</span><span>total</span></span> × 360 (ou × 180).</div><h4>Mes bilans</h4><div class="row">${[0,1,2].map(i=>`<button class="btn alt" data-act="bilan" data-i="${i}">📊 Mission ${i+1} : ${rT(i)} %</button>`).join("")}</div><button class="btn" data-act="map">Retour à la carte</button></div>`}
else if(S.step==="flash"){const f=L[S.fi],ans=S.fl[S.fi],last=S.fi===L.length-1,k=(S.res[S.m]?S.res[S.m].tries.length:0)+1;a.innerHTML=hd+`<div class="card"><h3>Défi flash${k>1?" · "+ess(k):""} · question ${S.fi+1} sur ${L.length}</h3><div id="fq">${FBOX(f)}</div><button class="snd" data-act="say" data-id="fq">🔊 Écouter</button><div class="opts">${f.o.map((o,j)=>`<button class="opt ${ans===j?(j===f.ok?"ok":"ko"):""}" data-act="fl" data-i="${S.fi}" data-j="${j}">${o}</button>`).join("")}</div>${ans!==undefined?`<div class="fb ${ans===f.ok?"ok":"ko"}">${ans===f.ok?"✔ Bien vu !":"✘ Pas tout à fait."}</div><div class="expl">${FMT(f.e)}</div><p><button class="btn" data-act="nf">${last?"Voir mes résultats":"Question suivante"}</button></p>`:""}</div>`}
else if(S.step==="lvl"){const tr=S.res[S.m].tries,T=tr[tr.length-1],R=fst(S.m,T.fl,T.s),pct=pc(R.ok,R.n),rec=pct<50?"g":pct<90?"s":"e";a.innerHTML=hd+`<div class="card"><h3>Mes résultats au défi flash${tr.length>1?" · "+ess(tr.length):""}</h3><p><b>${R.ok} bonnes réponses sur ${R.n} : ${pct} % de réussite</b></p>${bar(pct)}${tr.length>1?`<p class="tip">${tr.map((x,j)=>`${ess(j+1)} : ${pc(fst(S.m,x.fl,x.s).ok,10)} %`).join(" · ")}</p>`:""}${nlist(m,R.sk,true)}<button class="btn alt" data-act="retry">🔁 Refaire un défi flash (nouvelle série)</button></div><div class="card"><h3>Choisis ton parcours</h3><p>Parcours conseillé : <b>${{g:"Guidé",s:"Standard",e:"Expert"}[rec]}</b>. C’est toi qui décides avec ton binôme. Tu pourras changer de parcours à tout moment.</p><div class="lv">${[["g","🟢 Guidé","Les 3 étapes avec « Ce que je dois faire »"],["s","🟡 Standard","Les 3 étapes avec coups de pouce"],["e","🔴 Expert","Les 3 étapes sans aide, plus des défis"]].map(l=>`<button data-act="pick" data-l="${l[0]}" class="${l[0]===rec?"rec":""}"><b>${l[1]}</b><br>${l[2]}</button>`).join("")}</div></div>`}
else if(S.step==="work"){const done=ST().every(x=>S.ae[x.k]&&S.ae[x.k].c!==undefined),ch=ST().some(x=>S.ae[x.k]&&(S.ae[x.k].n===0||S.ae[x.k].n===2));a.innerHTML=hd+`<p>Parcours <b>${{g:"🟢 Guidé",s:"🟡 Standard",e:"🔴 Expert"}[S.lvl]}</b> · Calcule et rédige sur ton carnet de missions.</p>${m.lv[S.lvl].map(id=>exo(id,S.lvl)).join("")}<details><summary>Rappel de cours</summary>${RAP(m)}</details><div class="card"><h3>Mon auto-évaluation</h3><p>Chaque élève répond pour lui-même.</p>${ST().map(x=>{const v=S.ae[x.k]||{};return `<h4>${x.n}</h4><p>Comment s’est passé ce parcours ?</p><div class="seg">${AEC.map((l,j)=>`<button aria-pressed="${v.c===j}" data-act="ae" data-s="${x.k}" data-g="c" data-j="${j}">${l}</button>`).join("")}</div><p>Ce parcours était :</p><div class="seg">${AEN.map((l,j)=>`<button aria-pressed="${v.n===j}" data-act="ae" data-s="${x.k}" data-g="n" data-j="${j}">${l}</button>`).join("")}</div>`}).join("")}${ch?`<p class="tip">Vous pouvez changer de parcours sans refaire le défi flash.</p><button class="btn alt" data-act="lvl">↩ Changer de parcours</button>`:""}${done?`<p><button class="btn" data-act="synth">Passer à l’épreuve de synthèse</button></p>`:`<p class="tip">Chaque élève répond à la première question pour continuer.</p>`}</div>`}
else if(S.step==="synth2"){a.innerHTML=hd+synthCard(m,m.s2,m.sd2,S.s2,"s","2ᵉ exercice de synthèse","Terminer et voir mon bilan actualisé")}
else{a.innerHTML=hd+synthCard(m,m.s,m.sd,S,"","Épreuve de synthèse","Récupérer la pièce et voir mon bilan")}}
const SAVEFORM=msg=>`<p>Choisis un <b>code à 4 chiffres</b> pour retrouver ton travail plus tard.</p><label>Code <input type="text" id="savecode" inputmode="numeric" maxlength="4" autocomplete="off"></label> <button class="btn" data-act="dosave">Enregistrer</button>${msg?`<p class="fb ko">${msg}</p>`:""}`;
function saveWork(c){try{const k="stat3:"+c,old=localStorage.getItem(k);if(old){const o=JSON.parse(old);if(o.nm&&o.nm.a!==S.nm.a)return "Ce code est déjà utilisé par un autre binôme. Choisis un autre code."}localStorage.setItem(k,JSON.stringify({v:1,t:Date.now(),nm:S.nm,pieces:S.pieces,res:S.res,modU:S.modU,mod:S.mod}));return ""}catch(e){return "L’enregistrement n’est pas disponible sur cet appareil."}}
function loadWork(c){try{const raw=localStorage.getItem("stat3:"+c);if(!raw)return "Aucun travail trouvé avec ce code.";const o=JSON.parse(raw),u=a=>(a||[]).map(x=>x===null?undefined:x);Object.assign(S.nm,o.nm);S.pieces=o.pieces;S.res=o.res||{};S.modU=!!o.modU;S.mod={sy:u(o.mod&&o.mod.sy),fb:u(o.mod&&o.mod.fb),at:u(o.mod&&o.mod.at),ft:u(o.mod&&o.mod.ft)};return ""}catch(e){return "Impossible de lire cette sauvegarde."}}
const num=v=>{v=String(v).trim().replace(/\s/g,"").replace(",",".").replace(/[%°a-zA-Z€]/g,"");if(v.includes("/")){const[p,q]=v.split("/");return p/q}return parseFloat(v)};
const good=(q,v)=>{const n=num(v);return !isNaN(n)&&(Math.abs(n-q.a)<.01||(q.pct&&Math.abs(n*100-q.a)<.01))};
function runChk(list,st,p){st.fb=list.map((q,i)=>{if(q.ty==="num"){st.sy[i]=$("#r"+p+i).value;return st.sy[i].trim()!==""&&!!good(q,st.sy[i])}return st.sy[i]===q.ok});if(!st.ft.length)st.ft=[...st.fb];st.fb.forEach((o,i)=>{if(!o)st.at[i]=(st.at[i]||0)+1})}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const d=b.dataset,mi=S.scr==="bilan"?S.bm:S.m,m=M[mi];let nav=true;
switch(d.act){
case"conf":conf();return;
case"rap":modal("Rappels",S.scr==="mission"||S.scr==="bilan"?RAP(m):M.map((x,i)=>`<h4>Mission ${i+1}</h4>${RAP(x)}`).join(""));return;
case"gl":modal(d.t,`<p>${GL[d.t]||""}</p>`);return;case"close":b.closest(".modal").remove();return;
case"say":say(d.id);return;
case"rb":modal(m.rb[+d.k].t,RB(m.rb[+d.k],false));return;
case"set":P[d.k]=isNaN(+d.v)||d.k==="bg"?d.v:+d.v;applyP();b.closest(".modal").remove();conf();return;
case"start":{const g=k=>$("#"+k).value;const p1=g("p1"),n1=g("n1"),p2=g("p2"),n2=g("n2");Object.assign(S.nm,{p1,n1,p2,n2});if(!p1.trim()||!n1.trim()){S.nmErr=true;nav=false;break}S.nmErr=false;S.nm.a=esc(cap(p1)+" "+n1.trim().replace(/\s+/g," ").toUpperCase());S.nm.b=(p2.trim()||n2.trim())?esc([p2.trim()?cap(p2):"",n2.trim().replace(/\s+/g," ").toUpperCase()].filter(Boolean).join(" ")):"";S.scr="map";break}
case"savem":if(!S.nm.a){modal("Enregistrer mon travail","<p>Écrivez d’abord les noms du binôme, puis cliquez sur « Commencer ».</p>");return}modal("Enregistrer mon travail",SAVEFORM(""));return;
case"dosave":{const c=$("#savecode").value.trim(),o=document.querySelector(".modal");if(o)o.remove();if(!/^\d{4}$/.test(c)){modal("Enregistrer mon travail",SAVEFORM("Le code doit contenir exactement 4 chiffres."));return}const r=saveWork(c);r?modal("Enregistrer mon travail",SAVEFORM(r)):modal("Travail enregistré",`<p>Ton travail est enregistré avec le code <b>${c}</b>.</p><p>Note ce code : il permet de reprendre sur <b>cette tablette</b>, avec le même navigateur.</p>`);return}
case"resume":{const c=$("#rcode").value.trim(),r=/^\d{4}$/.test(c)?loadWork(c):"Le code doit contenir 4 chiffres.";S.rErr=r;if(!r){S.nmErr=false;S.scr="map"}else nav=false;break}
case"map":S.scr="map";break;case"exit":S.scr="exit";break;case"mod":S.scr="mod";break;
case"unlock":if($("#code").value.trim()==="1234"){S.modU=true;S.codeErr=false}else S.codeErr=true;nav=false;break;
case"bilan":S.bm=+d.i;S.scr="bilan";break;
case"door":Object.assign(S,{scr:"mission",m:+d.i,fi:0,series:1,fl:[],lvl:null,sy:[],fb:[],at:[],ft:[],ae:{a:{},b:{}},s2:{sy:[],fb:[],at:[],ft:[]},step:S.res[+d.i]?"lvl":"flash"});break;
case"retry":{const T=lastT(S.m);S.series=T.s===1?2:1;S.fi=0;S.fl=[];S.step="flash";break}
case"fl":if(S.fl[+d.i]===undefined)S.fl[+d.i]=+d.j;nav=false;break;
case"nf":if(S.fi<(S.series===2?m.flash2:m.flash).length-1)S.fi++;else{const T={fl:[...S.fl],s:S.series};if(S.res[S.m])S.res[S.m].tries.push(T);else S.res[S.m]={tries:[T],ft:null,ft2:null,ae:null};S.step="lvl"}break;
case"lvl":S.step="lvl";break;case"pick":S.lvl=d.l;S.step="work";break;case"synth":S.step="synth";break;
case"ae":S.ae[d.s]=S.ae[d.s]||{};S.ae[d.s][d.g]=+d.j;nav=false;break;
case"chk":runChk(m.s,S,"");nav=false;break;
case"chk2":runChk(m.s2,S.s2,"s");nav=false;break;
case"chkm":runChk(MOD.s,S.mod,"m");nav=false;break;
case"sel":{const st=d.p==="m"?S.mod:d.p==="s"?S.s2:S,list=d.p==="m"?MOD.s:d.p==="s"?m.s2:m.s;list.forEach((q,i)=>{if(q.ty==="num"&&$("#r"+d.p+i))st.sy[i]=$("#r"+d.p+i).value});st.sy[+d.i]=+d.j;if(st.fb.length)st.fb[+d.i]=undefined;nav=false;break}
case"piece":S.pieces[S.m]=true;S.res[S.m].ft=[...S.ft];S.res[S.m].ae={a:S.ae.a.c,b:S.ae.b&&S.ae.b.c};S.bm=S.m;S.scr="bilan";break;
case"syn2":S.m=S.bm;S.s2={sy:[],fb:[],at:[],ft:[]};S.scr="mission";S.step="synth2";break;
case"piece2":S.res[S.m].ft2=[...S.s2.ft];S.bm=S.m;S.scr="bilan";break}
render();if(nav)window.scrollTo(0,0)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const o=document.querySelector(".modal");if(o)o.remove()}});
applyP();render();
</script>
</body>
